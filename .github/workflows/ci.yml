name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI has no .env.local; dummy public Firebase values are enough for typecheck/build.
  NEXT_PUBLIC_FIREBASE_API_KEY: demo-api-key
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-scorpio.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-scorpio
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-scorpio.appspot.com
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm install -g npm@11 # lockfile is generated by npm 11; Node 22 ships npm 10 and rejects it
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run typecheck

  eslint:
    # Non-blocking: baseline is 246 errors / 195 warnings. Make blocking after RT-31.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11 # lockfile is generated by npm 11; Node 22 ships npm 10 and rejects it
      - run: npm ci
      - run: npm run lint

  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm install -g npm@11 # lockfile is generated by npm 11; Node 22 ships npm 10 and rejects it
      - run: npm ci
      - run: npm ci # the function tests import firebase-admin, firebase-functions and @polar-sh/sdk from here
        working-directory: functions
      - run: npm run test:ci

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g npm@11 # lockfile is generated by npm 11; Node 22 ships npm 10 and rejects it
      - run: npm install -g firebase-tools@15.5.1 # test:security shells out to `firebase emulators:exec`
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run test:security

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm install -g npm@11 # lockfile is generated by npm 11; Node 22 ships npm 10 and rejects it
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - run: npm run build
      - run: npm run build
        working-directory: functions

  audit:
    # Non-blocking for now: baseline has 43 high/critical production advisories (fixed by RT-02).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
        working-directory: functions

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks-action needs a paid license for organization repos, so run the open-source CLI directly.
      - name: Scan for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          # Pull requests scan only their own commits. Secrets already in main's history are tracked by RT-01/RT-33.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gitleaks detect --source . --redact --verbose --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            ./gitleaks detect --source . --redact --verbose --log-opts="${{ github.event.before }}..HEAD"
          fi
